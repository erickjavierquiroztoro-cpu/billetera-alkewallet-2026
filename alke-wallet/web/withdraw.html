<!DOCTYPE html>
<html lang="es">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Erick - erickjavierquiroztoro@gmail.com">
    <meta name="description" content="Mi primera Wallet-digital">
    <meta name="keyboards" content="HTML5, CSS, bootstraps, JavaScript, jQuery">

   <link rel="shortcut icon" href="../assets/img/wallet_logo.svg" type="image/x-icon">
  <link rel="stylesheet" href="../assets/css/bootstraps.css">
 <link rel="stylesheet" href="../assets/css/styles.css">
  
  <title>Wallet - Retirar Dinero</title>
  <style>
    body { padding: 20px; }
    .container { max-width: 400px; margin: 0 auto; }
  </style>
</head>
<body class="withdraw-wallet">
  <div class="container">
    <h2>Retirar Dinero</h2>
    <div class="saldo-box"> Saldo actual: <strong data-balance>$0</strong>
    </div>
    <div class="alert d-none" id="withdrawMessage" role="alert"></div>
 
    <!-- Retiro de dinero -->
    <form id="withdrawForm" novalidate>
  <div class="form-group">
    <label for="withdrawAmount">Monto a retirar:</label>
    <input type="number" class="form-control" id="withdrawAmount" min="1" step="1" placeholder="Ej: 10000">
  </div>

  <button type="submit" class="btn btn-warning">Realizar retiro</button>
  <a href="menu.html" class="btn btn-secondary ml-2">Volver</a>
</form>
  </div>
 
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/withdraw.js"></script>
</body>
</html>
