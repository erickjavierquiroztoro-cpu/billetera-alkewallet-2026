<!DOCTYPE html>
<html lang="es">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Erick - erickjavierquiroztoro@gmail.com">
    <meta name="description" content="Mi primera Wallet-digital">
    <meta name="keyboards" content="HTML5, CSS, bootstraps, JavaScript, jQuery">
    <meta name="robots" content="index, follow">

   <link rel="shortcut icon" href="../assets/img/wallet_logo.svg" type="image/x-icon">
  <link rel="stylesheet" href="../assets/css/bootstraps.css">
 <link rel="stylesheet" href="../assets/css/styles.css">
  
  <title>Wallet - Enviar Dinero</title>
  <style>
    body { padding: 20px; }
    .container { max-width: 400px; margin: 0 auto; }
  </style>
</head>
<body class="sendmoney-wallet">
  <div class="container">
    <h2>Enviar Dinero</h2>
    <div class="saldo-box">
      Saldo actual: <strong data-balance>$0</strong>
    </div>
    <div class="alert d-none" id="sendMessage" role="alert"></div>
 
    <!-- Buscador de contactos -->
    <form class="mb-3" id="searchForm">
      <div class="form-group">
        <label for="search">Buscar en agenda:</label>
        <div class="input-group">
          <input type="text" class="form-control" id="search" placeholder="Nombre o email">
          <div class="input-group-append">
            <button class="btn btn-primary" type="button" id="searchButton">Buscar</button>
          </div>
        </div>
      </div>
    </form>

    <ul class="list-group mb-3" id="contactsList"></ul>
 
    <!-- Botón para abrir formulario de nuevo contacto -->
    <button class="btn btn-outline-secondary btn-block mb-3" type="button" data-toggle="collapse" data-target="#newContact">
      + Agregar nuevo contacto
    </button>
 
    <!-- Formulario emergente de nuevo contacto -->
    <div class="collapse mb-3" id="newContact">
      <form class="card card-body" id="contactForm" novalidate>
        <h5>Nuevo contacto</h5>
        <div class="form-group">
          <label for="contactName">Nombre:</label>
          <input type="text" class="form-control" id="contactName" placeholder="Nombre completo">
        </div>
        <div class="form-group">
          <label for="contactEmail">Email:</label>
          <input type="email" class="form-control" id="contactEmail" placeholder="email@ejemplo.com">
        </div>
        <button class="btn btn-success" type="submit">Guardar contacto</button>
      </form>
    </div>

    <form id="transferForm" class="mb-3" novalidate>
      <div class="form-group">
        <label>Contacto seleccionado:</label>
        <p class="selected-contact" id="selectedContact">Ninguno</p>
      </div>
      <div class="form-group">
        <label for="transferAmount">Monto a transferir:</label>
        <input type="number" class="form-control" id="transferAmount" min="1" step="1" placeholder="Ej: 3500">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Enviar dinero</button>
    </form>
 
    <a href="menu.html" class="btn btn-secondary">Volver al Menú Principal</a>
  </div>
 
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/sendmoney.js"></script>
</body>
</html>
